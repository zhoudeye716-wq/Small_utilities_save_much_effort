name: 📖 文档与说明改进
description: 使用指南、README 或其他说明有缺漏、不清楚或错误时，请选择此模板
title: "[文档] "
body:
  - type: textarea
    id: location
    attributes:
      label: 涉及的文档或页面
      description: 请提供文档名称、链接或小程序内的页面位置。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 哪些说明不清楚、有错误，或者缺少了什么内容？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议的修改（可选）
      description: 你希望增加或调整哪些说明？
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 截图或其他补充（可选）
      description: 可以附上截图、示例或相关链接，请先遮盖不希望公开的信息。
    validations:
      required: false
